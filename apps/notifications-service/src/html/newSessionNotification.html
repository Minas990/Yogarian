<html>
  <body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin:0; padding:0;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 20px 0;">
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; padding: 20px;">
            
            <!-- Greeting -->
            <tr>
              <td style="padding-bottom: 10px; font-size: 16px; color: #333;">
                <p>Hello,</p>
              </td>
            </tr>

            <!-- Message -->
            <tr>
              <td style="padding-bottom: 15px; font-size: 16px; color: #555;">
                <p>{{message}}</p>
              </td>
            </tr>

            <tr>
              <td style="padding-bottom: 10px; font-size: 14px; color: #555;">
                <p><strong>Session ID:</strong> {{sessionId}}</p>
                <p><strong>Trainer:</strong> {{trainerName}} (ID: {{trainerId}})</p>
                <p><strong>Title:</strong> {{title}}</p>
                <p><strong>Date & Time:</strong> {{startTime}}</p>
                <p><strong>Price:</strong> {{price}}</p>
                <p><strong>Location:</strong> {{address}}</p>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding: 15px 0;">
                <a href="{{sessionLink}}" 
                   style="background-color:#6c63ff; color:#ffffff; padding:12px 25px; text-decoration:none; border-radius:5px; font-weight:bold; display:inline-block;">
                   View Session
                </a>
              </td>
            </tr>

            <tr>
              <td style="font-size:12px; color:#888; padding-top:15px; text-align:center;">
                You are receiving this email because you follow {{trainerName}} or are near this session.
                            </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
