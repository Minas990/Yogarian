{{- range $serviceName, $service := .Values.services }}
{{- if and $service.enabled $service.networkPolicy $service.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "yoga.serviceFullname" (dict "root" $ "serviceName" $serviceName) }}-ingress
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "yoga.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  podSelector:
    matchLabels:
      {{- include "yoga.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $serviceName }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "yoga.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: api-gateway
        - podSelector:
            matchLabels:
              {{- include "yoga.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: {{ $serviceName }}
      ports:
        - protocol: TCP
          port: {{ $service.port }}
        {{- range $extraPort := $service.extraServicePorts }}
        - protocol: {{ default "TCP" $extraPort.protocol }}
          port: {{ $extraPort.port }}
        {{- end }}
---
{{- end }}
{{- end }}
