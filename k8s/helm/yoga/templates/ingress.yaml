{{- range $serviceName, $service := .Values.services }}
{{- if and $service.enabled $service.ingress $service.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "yoga.serviceFullname" (dict "root" $ "serviceName" $serviceName) }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "yoga.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  {{- with $service.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $service.ingress.className }}
  ingressClassName: {{ $service.ingress.className }}
  {{- end }}
  rules:
    {{- range $host := $service.ingress.hosts }}
    - host: {{ $host.host | quote }}
      http:
        paths:
          {{- range $path := $host.paths }}
          - path: {{ $path.path }}
            pathType: {{ default "Prefix" $path.pathType }}
            backend:
              service:
                name: {{ include "yoga.serviceFullname" (dict "root" $ "serviceName" $serviceName) }}
                port:
                  number: {{ $service.port }}
          {{- end }}
    {{- end }}
  {{- with $service.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- end }}
